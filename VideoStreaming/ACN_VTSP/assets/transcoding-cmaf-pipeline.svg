<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <style>
    .hdr { font: 700 16px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 400 11.5px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .box-t { font: 700 12.5px 'Segoe UI', system-ui, sans-serif; fill: #f1f5f9; }
    .mono { font: 600 10.5px 'Consolas', monospace; fill: #22d3ee; }
    .small { font: 400 10.5px 'Segoe UI', system-ui, sans-serif; fill: #cbd5e1; }
    .dash { stroke-dasharray: 7 5; animation: moveDash 1s linear infinite; }
    @keyframes moveDash { to { stroke-dashoffset: -24; } }
  </style>

  <rect width="1050" height="340" rx="14" fill="url(#bgA)" stroke="#1e293b" stroke-width="2"/>

  <text x="24" y="32" class="hdr">Pipeline A: Zero-Waste Autoscaled KEDA Spot Transcoding &amp; Single-Decode CMAF Packaging</text>
  <text x="24" y="50" class="sub">Direct S3 Multipart Ingest → Kafka Event → KEDA Spot CPU Pod → FFmpeg Single-Decode -filter_complex → Progressive 360p/720p/1080p CMAF (.m4s)</text>

  <!-- Step 1: Client Upload -->
  <g transform="translate(24, 75)">
    <rect width="175" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="87" y="25" text-anchor="middle" class="box-t">1. Direct Ingest</text>
    <text x="87" y="43" text-anchor="middle" class="mono">tus.io / S3 Multipart</text>
    <rect x="16" y="60" width="143" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="87" y="80" text-anchor="middle" class="small">10MB Chunks → R2 Raw</text>
    <text x="87" y="96" text-anchor="middle" class="mono" fill="#34d399">Bypasses API RAM</text>
    <rect x="16" y="118" width="143" height="92" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="87" y="138" text-anchor="middle" class="box-t" fill="#fbbf24">ffprobe Inspect</text>
    <text x="87" y="158" text-anchor="middle" class="small">• 16:9 Landscape VOD</text>
    <text x="87" y="176" text-anchor="middle" class="small">• 9:16 Vertical Shorts</text>
    <text x="87" y="194" text-anchor="middle" class="mono">Keyframe -g 48</text>
  </g>

  <!-- Step 2: KEDA & FFmpeg Single Decode -->
  <g transform="translate(245, 75)">
    <rect width="245" height="230" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="1.8"/>
    <text x="122" y="25" text-anchor="middle" class="box-t">2. KEDA Spot FFmpeg Pod</text>
    <text x="122" y="43" text-anchor="middle" class="mono">Single Decode into Memory</text>
    <rect x="16" y="58" width="213" height="65" rx="6" fill="#0f172a" stroke="#06b6d4"/>
    <text x="122" y="78" text-anchor="middle" class="mono" fill="#f8fafc">-filter_complex="[0:v]split=3"</text>
    <text x="122" y="95" text-anchor="middle" class="small">Decodes input stream ONCE</text>
    <text x="122" y="111" text-anchor="middle" class="small">Outputs 3 ABR ladders in parallel</text>
    <rect x="16" y="135" width="213" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="122" y="155" text-anchor="middle" class="box-t" fill="#34d399">Tiered Codec Strategy</text>
    <text x="122" y="173" text-anchor="middle" class="small">• Upload: H.264 (Universal Fast)</text>
    <text x="122" y="191" text-anchor="middle" class="small">• &gt;500 Views: AV1 / HEVC (-45% BW)</text>
  </g>

  <!-- Step 3: Parallel Renditions -->
  <g transform="translate(545, 75)">
    <rect width="230" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.8"/>
    <text x="14" y="24" class="box-t" fill="#34d399">⚡ 360p CMAF (Instant Ready)</text>
    <text x="14" y="42" class="mono" fill="#a7f3d0">640x360 / 360x640 • 800 kbps</text>
    <text x="14" y="57" class="small" fill="#ecfdf5">Status flips to STREAMABLE in ~3s</text>

    <rect y="81" width="230" height="68" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="105" class="box-t">720p HD CMAF Rendition</text>
    <text x="14" y="123" class="mono">1280x720 / 720x1280 • 2.5 Mbps</text>
    <text x="14" y="138" class="small">Default Fast-Startup ABR Track</text>

    <rect y="162" width="230" height="68" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="14" y="186" class="box-t">1080p Full HD CMAF</text>
    <text x="14" y="204" class="mono" fill="#c084fc">1920x1080 / 1080x1920 • 5.0 Mbps</text>
    <text x="14" y="219" class="small">2s Fragmented MP4 (.m4s) + WebP</text>
  </g>

  <!-- Step 4: Unified CMAF Output -->
  <g transform="translate(830, 75)">
    <rect width="196" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <text x="98" y="25" text-anchor="middle" class="box-t">4. Processed R2 &amp; CDN</text>
    <text x="98" y="43" text-anchor="middle" class="mono" fill="#34d399">Write Once, Play Everywhere</text>
    <rect x="14" y="58" width="168" height="72" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="98" y="78" text-anchor="middle" class="mono" fill="#f8fafc">master.m3u8 + manifest.mpd</text>
    <text x="98" y="96" text-anchor="middle" class="small">Apple HLS &amp; Android DASH</text>
    <text x="98" y="112" text-anchor="middle" class="small">share identical .m4s chunks</text>
    <rect x="14" y="142" width="168" height="72" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="98" y="162" text-anchor="middle" class="box-t" fill="#34d399">Cache-Control: Immutable</text>
    <text x="98" y="180" text-anchor="middle" class="mono">max-age=31536000 (365d)</text>
    <text x="98" y="198" text-anchor="middle" class="small">$0 Cloudflare R2 Egress</text>
  </g>

  <!-- Animated Arrows -->
  <path d="M 199 190 L 238 190" fill="none" stroke="#22d3ee" stroke-width="2" class="dash" marker-end="url(#arrCyan)"/>
  <path d="M 490 150 L 538 110" fill="none" stroke="#34d399" stroke-width="2" class="dash" marker-end="url(#arrEmerald)"/>
  <path d="M 490 190 L 538 190" fill="none" stroke="#22d3ee" stroke-width="2" class="dash" marker-end="url(#arrCyan)"/>
  <path d="M 490 230 L 538 270" fill="none" stroke="#22d3ee" stroke-width="2" class="dash" marker-end="url(#arrCyan)"/>

  <path d="M 775 110 L 823 150" fill="none" stroke="#34d399" stroke-width="2" class="dash" marker-end="url(#arrEmerald)"/>
  <path d="M 775 190 L 823 190" fill="none" stroke="#34d399" stroke-width="2" class="dash" marker-end="url(#arrEmerald)"/>
  <path d="M 775 270 L 823 230" fill="none" stroke="#34d399" stroke-width="2" class="dash" marker-end="url(#arrEmerald)"/>

  <circle r="4" fill="#34d399" filter="url(#glowA)">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 490 150 L 538 110"/>
  </circle>
  <circle r="4" fill="#22d3ee" filter="url(#glowA)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 490 190 L 538 190"/>
  </circle>
  <circle r="4" fill="#34d399" filter="url(#glowA)">
    <animateMotion dur="1.2s" repeatCount="indefinite" path="M 775 190 L 823 190"/>
  </circle>
</svg>

