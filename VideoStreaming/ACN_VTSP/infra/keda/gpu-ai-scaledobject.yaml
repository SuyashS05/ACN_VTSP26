apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gpu-ai-enrichment-spot-scaler
  namespace: acn-media-workers
spec:
  scaleTargetRef:
    name: ai-enrichment-gpu-worker
  pollingInterval: 10
  cooldownPeriod: 90
  minReplicaCount: 0          # Zero idle GPU cost when no videos are queued
  maxReplicaCount: 16         # Scales Spot T4 / L4 GPU pods on demand
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-cluster.acn-infra.svc:9092
        consumerGroup: gpu-ai-enrichment-group
        topic: video.ingest.object_created
        lagThreshold: "3"

